<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Signal">
  <!-- Brand teal (--primary, globals.css). Solid tile so the mark stays legible
       at 16px in both light and dark browser chrome. -->
  <rect width="32" height="32" rx="7.5" fill="#0F766E"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round">
    <!-- Broadcast arcs: a signal radiating from a listening point. -->
    <path d="M16.5 21.5 A 6 6 0 0 0 10.5 15.5"/>
    <path d="M21 21.5 A 10.5 10.5 0 0 0 10.5 11"/>
  </g>
  <circle cx="10.5" cy="21.5" r="2.5" fill="#FFFFFF"/>
</svg>
